<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pipeline-title pipeline-desc" id="pipeline-root">
        <title id="pipeline-title">qaoa-diag pipeline</title>
        <desc id="pipeline-desc">Exact ground truth, the measured depth ceiling and the gradient at the final angles all feed diagnose(), which returns one of four verdicts.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #pipeline-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #pipeline-root { font-family: var(--font-sans); color: var(--color-ink); }
      #pipeline-root .diagram-container { width: 100%; overflow-x: auto; }
      #pipeline-root .diagram-container { overflow-x: visible; }</style>
          <marker id="pipeline-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="pipeline-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- connectors first: they sit behind the nodes -->
        <line x1="240" y1="128" x2="240" y2="238" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#pipeline-arrow)"/>
        <line x1="480" y1="128" x2="480" y2="238" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#pipeline-arrow)"/>
        <line x1="720" y1="128" x2="720" y2="238" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#pipeline-arrow)"/>
        <line x1="480" y1="388" x2="480" y2="354" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#pipeline-arrow)"/>

        <!-- arrow labels, masked, offset beside the vertical stroke -->
        <rect x="248" y="168" width="72" height="12" rx="2" fill="#f5f5f5"/>
        <text x="252" y="177" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.06em">EXACT GROUND</text>

        <rect x="488" y="168" width="52" height="12" rx="2" fill="#f5f5f5"/>
        <text x="492" y="177" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.06em">GRADIENT</text>

        <rect x="728" y="168" width="48" height="12" rx="2" fill="#f5f5f5"/>
        <text x="732" y="177" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.06em">CEILING</text>

        <rect x="488" y="360" width="80" height="12" rx="2" fill="#f5f5f5"/>
        <text x="492" y="369" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.06em">PARAMS, DEPTH</text>

        <!-- problem.py : store -->
        <rect x="140" y="40" width="200" height="88" rx="6" fill="#f5f5f5"/>
        <rect x="140" y="40" width="200" height="88" rx="6" fill="#2d3142" stroke="#4f5d75" stroke-width="1" fill-opacity="0.05"/>
        <rect x="148" y="46" width="40" height="12" rx="2" fill="none" stroke="#4f5d75" stroke-width="0.8" stroke-opacity="0.40"/>
        <text x="168" y="55" fill="#4f5d75" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em" fill-opacity="0.80">BUILD</text>
        <text x="240" y="86" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">problem.py</text>
        <text x="240" y="102" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">diagonal H, exact ground</text>

        <!-- sim.py : backend -->
        <rect x="380" y="40" width="200" height="88" rx="6" fill="#f5f5f5"/>
        <rect x="380" y="40" width="200" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="388" y="46" width="46" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.40"/>
        <text x="411" y="55" fill="#2d3142" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em" fill-opacity="0.80">SIMULATE</text>
        <text x="480" y="86" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">sim.py</text>
        <text x="480" y="102" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">statevector, O(p n 2^n)</text>

        <!-- optimize.py : backend -->
        <rect x="620" y="40" width="200" height="88" rx="6" fill="#f5f5f5"/>
        <rect x="620" y="40" width="200" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="628" y="46" width="46" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.40"/>
        <text x="651" y="55" fill="#2d3142" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em" fill-opacity="0.80">OPTIMIZE</text>
        <text x="720" y="86" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">optimize.py</text>
        <text x="720" y="102" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">adam, gd, lbfgs, multi_start</text>

        <!-- diagnose : focal -->
        <rect x="140" y="240" width="680" height="112" rx="6" fill="#f5f5f5"/>
        <rect x="140" y="240" width="680" height="112" rx="6" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.08"/>
        <rect x="148" y="246" width="40" height="12" rx="2" fill="none" stroke="#bf4520" stroke-width="0.8" stroke-opacity="0.40"/>
        <text x="168" y="255" fill="#bf4520" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em" fill-opacity="0.80">VERDICT</text>
        <text x="480" y="298" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">diagnose(params, problem, depth)</text>
        <text x="480" y="316" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">optimal / ansatz-limited / stationary-point / under-converged</text>

        <!-- entry -->
        <rect x="300" y="388" width="360" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="300" y="388" width="360" height="64" rx="6" fill="#4f5d75" stroke="#5a6580" stroke-width="1" fill-opacity="0.10"/>
        <rect x="308" y="394" width="32" height="12" rx="2" fill="none" stroke="#5a6580" stroke-width="0.8" stroke-opacity="0.40"/>
        <text x="324" y="403" fill="#5a6580" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em" fill-opacity="0.80">INPUT</text>
        <text x="480" y="424" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">your QAOA run</text>
        <text x="480" y="440" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">gammas, betas, depth p</text>
      </svg>
