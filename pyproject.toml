[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "qaoa-diag"
version = "0.1.0"
description = "Diagnostics for small-graph QAOA: exact ground truth, measured depth ceilings, and a verdict on why an approximation ratio fell short."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["numpy", "scipy"]

[project.optional-dependencies]
test = ["pytest", "pennylane"]

[project.scripts]
qaoa-diag = "qaoa_diag.__main__:main"

[tool.setuptools]
packages = ["qaoa_diag"]
